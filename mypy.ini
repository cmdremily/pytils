[mypy]
# Basic Strictness
disallow_untyped_calls = True  # No function calls with untyped arguments
disallow_untyped_defines = True  # No functions or methods without type annotations
check_untyped_defs = True  # Check function bodies with untyped functions
warn_return_any = True  # Warn about functions returning 'Any'
warn_unreachable = True  # Warn if there are unreachable code blocks
warn_unused_ignores = True  # Warn about unused `# type: ignore` comments

# Strictness for Annotations
disallow_incomplete_defs = True  # Disallow incomplete function signatures (e.g., `def foo(x)` without a return type)
strict_optional = True  # Treat 'Optional' types strictly (e.g., `Optional[str]` should either be `None` or a `str`, not just any value)
no_implicit_optional = True  # Enforce explicit typing of Optional types
disallow_any_unimported = True  # Disallow 'Any' types from unimported modules

# Type Checking and Code Quality
warn_unused_configs = True  # Warn when there are unused config options
show_error_codes = True  # Show error codes for clarity
exclude = (?x)  # Exclude certain files or directories from type checking (use if needed)

# Linting-style checks
# These flags ensure mypy doesn't allow any common mistakes, such as returning None from a non-None-returning function
disallow_subclassing_any = True  # Disallow subclassing from Any
disallow_any_explicit = True  # Disallow using 'Any' explicitly
disallow_any_decorated = True  # Disallow using 'Any' with decorated functions
disallow_any_generics = True  # Disallow 'Any' for generic types
disallow_any_untyped = True  # Disallow 'Any' for untyped arguments

strict = True